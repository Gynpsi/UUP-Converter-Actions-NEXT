# .github/workflows/build-iso.yml
name: Build Windows ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 1800
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: 将 uup / output 目录挂到 D 盘
        shell: pwsh
        run: |
          $dRoot = "D:\a\${{ github.run_id }}"
          New-Item -ItemType Directory -Force -Path "$dRoot\uup"
          New-Item -ItemType Directory -Force -Path "$dRoot\output"

          # 如果 workspace 里已经存在同名目录（checkout 不会创建，但保险起见），先删掉
          if (Test-Path "$env:GITHUB_WORKSPACE\uup") { 
            Remove-Item "$env:GITHUB_WORKSPACE\uup" -Recurse -Force 
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\output") { 
            Remove-Item "$env:GITHUB_WORKSPACE\output" -Recurse -Force 
          }

          # 创建 junction（目录联接），对程序完全透明
          cmd /c mklink /J "$env:GITHUB_WORKSPACE\uup" "$dRoot\uup"
          cmd /c mklink /J "$env:GITHUB_WORKSPACE\output" "$dRoot\output"

          Write-Host "=== D 盘可用空间 ==="
          Get-PSDrive D | Select-Object Used,Free



      - name: Extract UUP package
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:GITHUB_WORKSPACE" -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "仓库根目录未找到 .zip 文件" }
          Write-Host "解压: $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:GITHUB_WORKSPACE\uup" -Force
          Get-ChildItem "$env:GITHUB_WORKSPACE\uup"

      - name: Download UUP files & Convert to ISO
        shell: cmd
        timeout-minutes: 600
        run: |
          cd /d %GITHUB_WORKSPACE%\uup
          call uup_download_windows.cmd


      - name: Collect ISO
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\output"
          New-Item -ItemType Directory -Force -Path $out
          
          Get-ChildItem "$env:GITHUB_WORKSPACE\uup" -Filter "*.iso" -Recurse | ForEach-Object {
            Write-Host "找到: $($_.Name) ($([math]::Round($_.Length/1MB,2)) MB)"
            Move-Item $_.FullName $out
          }
          
          if ((Get-ChildItem $out).Count -eq 0) { throw "未生成 ISO" }
          
          # SHA256
          Get-ChildItem $out -Filter "*.iso" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File "$out\$($_.BaseName).sha256.txt"
          }
          
          Get-ChildItem $out

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-iso
          path: output/*
          archive: true
          retention-days: 1
